name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packager
        run: python -m pip install --upgrade pyinstaller

      - name: Build app
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --name nono-desktop-pet
          --add-data "assets:assets"
          nono.py

      - name: Verify app bundle
        run: |
          test -d dist/nono-desktop-pet.app
          dist/nono-desktop-pet.app/Contents/MacOS/nono-desktop-pet --self-test

      - name: Create release ZIP
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          dist/nono-desktop-pet.app
          nono-desktop-pet-v1.0.0-macos.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: nono-desktop-pet-v1.0.0-macos
          path: nono-desktop-pet-v1.0.0-macos.zip
          if-no-files-found: error
